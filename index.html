<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="theme-color" content="#1e395b"><title>Dr. Ismael N. Talili | USTP PAEA</title><style>
:root{font-family:system-ui,-apple-system,Segoe UI,sans-serif;color:#fff;background:#101d30}*{box-sizing:border-box}body{margin:0;min-height:100svh;display:grid;place-items:center;background:radial-gradient(circle at 50% 25%,#2c496b,#101d30 70%)}main{width:min(100%,1050px);padding:24px 16px 36px;text-align:center}h1{font-size:clamp(1.15rem,3vw,1.7rem);margin:0 0 5px}p{color:#c4d1e1;margin:0 0 28px}.scene{perspective:1600px;width:100%;margin:auto;filter:drop-shadow(0 18px 24px #0007)}.card{width:100%;aspect-ratio:1623/928;position:relative;transform-style:preserve-3d;transition:transform 1.15s cubic-bezier(.2,.7,.2,1);cursor:pointer;outline:none}.card.flipped{transform:rotateY(180deg)}.face{position:absolute;inset:0;transform-style:preserve-3d;backface-visibility:hidden;-webkit-backface-visibility:hidden;overflow:hidden;border-radius:12px}.face img{width:100%;height:100%;object-fit:fill;display:block}.front{transform:rotateY(0deg)}.back{transform:rotateY(180deg)}.hint{font-size:.88rem;color:#aebdd0;margin:22px 0 18px}.actions{display:flex;gap:10px;flex-wrap:wrap;justify-content:center}button,.action{appearance:none;background:#ff7025;color:#13243a;font-weight:750;padding:12px 18px;border:0;border-radius:9px;cursor:pointer;text-decoration:none;font-size:.94rem}.secondary{background:#e7edf4}.foot{font-size:.75rem;color:#91a4bc;margin-top:24px}@media(prefers-reduced-motion:reduce){.card{transition:none}}@media(max-width:520px){main{padding:16px 12px 25px}.face{border-radius:6px}.hint{margin:18px 0}.actions{gap:8px}button,.action{padding:11px 12px;font-size:.84rem}}
</style></head><body><main><h1>Dr. Ismael N. Talili</h1><p>Presidential Assistant for External Affairs · USTP</p><div class="scene"><div id="card" class="card" role="button" tabindex="0" aria-label="Flip business card" aria-pressed="false"><div class="face front"><img src="front.png" alt="Front of Dr. Talili's USTP business card"></div><div class="face back"><img src="back.png" alt="Back of USTP PAEA business card describing external collaborations"></div></div></div><div class="hint">Tap the card to flip it</div><div class="actions"><button id="flip" class="secondary">Flip card</button><a class="action" href="contact.vcf" download="Ismael-Talili.vcf">Save contact</a><a class="action secondary" href="mailto:ismael.talili@ustp.edu.ph">Email</a><a class="action secondary" href="tel:+639171333065">Call</a></div><div class="foot">University of Science and Technology of Southern Philippines</div></main><script>
const card=document.getElementById('card');function flip(){card.classList.toggle('flipped');card.setAttribute('aria-pressed',String(card.classList.contains('flipped')))}card.addEventListener('click',flip);card.addEventListener('keydown',e=>{if(e.key==='Enter'||e.key===' '){e.preventDefault();flip()}});document.getElementById('flip').addEventListener('click',flip);if(!window.matchMedia('(prefers-reduced-motion: reduce)').matches)setTimeout(()=>{if(!card.classList.contains('flipped'))flip()},1800);
</script></body></html>
